plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.example.easylang"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
        // We'll copy the ONNX model to the files directory at runtime
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    packagingOptions {
        exclude "META-INF/LICENSE*"
        exclude "META-INF/NOTICE*"
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.webkit:webkit:1.8.0"
    // ONNX Runtime Mobile (offline dependency – Gradle will need internet once to fetch)
    implementation "com.microsoft.onnxruntime:onnxruntime-mobile:1.17.0"
    // SentencePiece Java binding (works on Android)
    implementation "com.github.google.sentencepiece:sentencepiece-android:0.2.0"
}
